<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelos de caixa</title>
    <style>
        h1 {
            background-color: blue;
            height: 200px;
            width: 200px;
            /* 
            BORDER shorthand

            border-width: 10px;
            border-color: black;
            border-style: solid;
            */
            border: 10px black solid;
            /*
            PADDING shorthand

            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
            */
            padding: 10px 10px 10px 10px;

            /*
            margin-top: 10px;
            margin-right: 10px;
            margin-bottom: 10px;
            margin-left: 100px;
            margin: auto;
            */
            margin: 20px 20px 40px 20px;
            /*
            outline-width: 12px;
            outline-style: dashed;
            outline-color: brown;
            */
            outline: 12px dashed brown;
        }

        a {
            border-width: 10px;
            border-color: red;
            border-style: solid;

            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
        }
    </style>
</head>
<body>
    <h1>caixa</h1>
</body>


</html>
