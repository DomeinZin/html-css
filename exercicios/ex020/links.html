<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        /*  SELETORES PERSONALIZADOS
            # = id
            . = class
            : = pseudo-class
            :: = pseudo-element
            > = children
        */

        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 19px;
        }

        p {
            text-align: justify;
        }

        a {
            color: rgb(255, 0, 0);
            text-decoration: none;
            font-weight: bold;
        }
        
        a:hover {
            color: rgb(0, 0, 0);
            text-decoration: underline;
        }

        a:visited {
            color: rgba(136, 0, 0, 0.486);
        }

        a:active {
            color: rgb(0, 255, 0);
        }

        /*pseudo elemento*/

        .especial {
            background-color: rgb(201, 194, 194);
        }

        a::before {
            content: '-->';
            text-decoration: none;
            font-weight: normal;
            color: darkgray;
        }

        a::after {
            content: '<--';
            text-decoration: none;
            font-weight: normal;
            color: darkgray;
        }
        /*------------------*/

        /* usando uma class */
        .especial::before {
            content: '-';
            text-decoration: none;
            font-weight: normal;
            color: darkgray;
        }

        .especial::after {
            content: '-';
            text-decoration: none;
            font-weight: normal;
            color: darkgray;
        }
        /* ------------------*/
    </style>
</head>
<body>

    <h1>Personalizando links</h1>
    
    <ul>
        <li><a href="https://gustavoguanabara.github.io" target="_blank">repositorio github</a></li>
        <li><a href="https://youtube.com/cursoemvideo/"target="_blank" class="especial">canal do youtube</a></li>
        <li><a href="https://www.cursoemvideo.com"target="_blank">site curo em video</a></li>
    </ul>

    <h2>:hover</h2>
    <p>quando passa o mouse em cima</p>

    <h2>:visited</h2>
    <p>quando o link ja foi visitado</p>

    <h2>:active</h2>
    <p>quando clica</p>

    <h1>::Pseudo elemento</h1>
    <p>o pseudo elemento pode agir nas classes , nos elementos, ID etc. . .  </p>
    <p>mexen no conteudo.</p>
</body>
</html>
